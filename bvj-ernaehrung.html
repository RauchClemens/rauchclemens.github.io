function answersName(id){return 'answers-'+id}

function matches(q,v){if(q.options)return String(q.answer)===v;const t=String(v??'').trim().replace(',','.');return /^(?:\d+(?:\.\d+)?|\.\d+)$/.test(t)&&Math.abs(Number(t)-q.answer)<0.000001}
function solution(q){return q.options?q.options[q.answer]:q.answer.toLocaleString('de-DE')+' '+q.unit}

 }).join('')+'<div id="quizsummary" class="summary" tabindex="-1" role="status">'+esc(result)+'</div><div class="actions">'+(graded?'<button type="button" class="btn secondary" data-act="retry">Neu versuchen</button>':'<button type="submit" class="btn">'+(final?'Abschlusstest auswerten':'Antworten auswerten')+'</button>')+'</div></form></section>';
}
function subHeader(index,label,title,intro,meta){return '<a href="#start" class="crumb">Kursübersicht</a><header class="unithead t'+index+'"><p class="eyebrow">'+label+'</p><h1>'+title+'</h1><p>'+intro+'</p><div class="meta">'+meta+'</div></header>'}
function lesson(id){const l=lessons[id-1];return '<article class="sub">'+subHeader(id,'Doppelstunde '+id+' von 3',l.title,l.goal,'<span>'+icon('clock')+'90 Minuten</span><span>'+icon('test')+'4 Prüffragen</span>')+'<div class="jump"><a href="#prueffragen" data-jump="prueffragen">Direkt zu den Prüffragen</a></div>'+[unitOne,unitTwo,unitThree][id-1]()+quiz(String(id))+'<div class="actions afterquiz"><a class="btn" href="'+(id===3?'#test':'#stunde-'+(id+1))+'">'+(id===3?'Weiter zum Abschlusstest':'Weiter zu Doppelstunde '+(id+1))+'</a><a href="#start">Zur Kursübersicht</a></div></article>'}
function exam(){return '<article class="sub">'+subHeader(4,'Abschluss der dritten Doppelstunde','Was nimmst du mit?','Wende dein Wissen auf neue Situationen im Betrieb und beim Einkauf an. Nach der Abgabe siehst du dein Ergebnis und die Lösungen.','<span>'+icon('clock')+'20 Minuten</span><span>'+icon('test')+'12 Fragen · 12 Punkte</span>')+quiz('test')+'<p class="afterquiz"><a href="#start">Zur Kursübersicht</a></p></article>'}
const schedules=[
 ['10 Min. Einstieg zu Sams Arbeitstag','20 Min. Lebensmittel zuordnen','30 Min. zwei Pausenboxen planen','20 Min. Packplan und Rückmeldung','10 Min. Prüffragen'],
 ['10 Min. Vermutungen zum Etikett','20 Min. Zutaten und Nährwerte lesen','25 Min. Zucker pro Flasche berechnen','25 Min. Beratung am Kiosk spielen','10 Min. Prüffragen'],
 ['10 Min. Einkaufssituation besprechen','15 Min. Grundpreise vergleichen','25 Min. zwei Einkäufe planen','10 Min. Einkaufspläne begründen','10 Min. Prüffragen','20 Min. Abschlusstest']
];
function plan(){return '<article class="sub">'+subHeader(1,'Für Lehrkräfte','Unterrichtsplan','Drei Doppelstunden à 90 Minuten. Der Abschlusstest liegt in den letzten 20 Minuten der dritten Doppelstunde.','<span>'+icon('book')+'Berufsvorbereitungsjahr</span>')+'<section class="planbox"><h2>Vor der Stunde</h2><p>Benötigt werden Papier, Stifte und ein Gerät mit Browser pro Paar. Für individuelle Testergebnisse braucht jede Person einen eigenen Browsertab oder ein eigenes Gerät. Ein Taschenrechner kann beim Rechnen helfen. Alle Etiketten und Preise stehen auf den Lernseiten.</p><p>Antworten und Notizen bleiben während der Sitzung in diesem Browsertab. Die Auswertung erscheint auf dem Gerät. Für die Ergebnissicherung können die Lernenden ihre Punktzahl und eine verbesserte Antwort ins Heft übertragen.</p></section><section class="planbox"><h2>Ablauf und Lernprodukte</h2>'+lessons.map((l,i)=>'<div class="planrow"><h3><a href="#stunde-'+(i+1)+'">'+(i+1)+'. '+l.title+'</a></h3><p>'+schedules[i].join(' · ')+'.</p><p><strong>Lernprodukt</strong> · '+['Zwei beschriftete Pausenboxen und ein Packplan für Sam.','Rechenwege mit Einheiten und ein Beratungshinweis für den Kiosk.','Zwei Einkaufslisten mit Kosten, Restgeld und begründeter Auswahl.'][i]+'</p></div>').join('')+'</section><section class="planbox"><h2>Unterstützung und Auswertung</h2><p><strong>Sprachhilfe</strong> · Lassen Sie die Lernenden zuerst zeigen, skizzieren oder zu zweit sprechen. Als Satzanfang eignet sich „Ich wähle …, weil …“.</p><p><strong>Rechenhilfe</strong> · Markieren Sie die Bezugsgröße farbig. Lassen Sie bei Getränken zuerst die Anzahl der 100-ml-Portionen bestimmen. Schnellere Paare entwickeln einen neuen Preis- oder Etikettenvergleich für ein anderes Team.</p><p><strong>Rückmeldung</strong> · Jede Doppelstunde schließt mit vier Prüffragen ab. Der Abschlusstest vergibt pro Thema vier Punkte. Besprechen Sie einen Rechenweg und eine begründete Auswahl aus einem Themenbereich, der noch Übung braucht.</p></section></article>'}
function sources(){return '<article class="sub">'+subHeader(1,'Unterrichtsmaterial','Quellen und Bildnachweis','Hier kannst du die Fachinformationen in Ruhe nachlesen.','')+'<section class="planbox"><h2>Fachliche Grundlagen</h2><ul class="references"><li>Lebensmittelgruppen, Abwechslung und Getränke. <a href="https://www.bzfe.de/einfache-sprache/gut-essen/die-ernaehrungspyramide-1">BZfE · Die Ernährungspyramide in einfacher Sprache</a></li><li>Zutaten und Zucker erkennen. <a href="https://www.bzfe.de/einfache-sprache/gut-essen/weniger-zucker-fette-und-salz">BZfE · Weniger Zucker, Fette und Salz</a></li><li>Packungsgrößen und Grundpreise vergleichen. <a href="https://www.verbraucherzentrale.de/wissen/lebensmittel/gesund-ernaehren/so-geht-gesunde-ernaehrung-mit-wenig-geld-96404">Verbraucherzentrale · Ernährung mit wenig Geld</a></li></ul></section><section class="planbox"><h2>Unterrichtsbeispiele</h2><p>Getränkeetiketten, Preise und Situationen wurden für diese Übungen erstellt. Das Titelbild wurde mit KI erzeugt.</p></section></article>'}
function route(){return location.hash.slice(1)||'start'}
function render(moveFocus=false){
 const path=route(),m=/^stunde-([123])$/.exec(path);let title='Kursübersicht',html;
 if(m){const id=Number(m[1]);title=lessons[id-1].title;html=lesson(id)}
 else if(path==='test'){title='Abschlusstest';html=exam()}
 else if(path==='unterricht'){title='Unterrichtsplan';html=plan()}
 else if(path==='quellen'){title='Quellen und Bildnachweis';html=sources()}
 else{html=home()}
 main.innerHTML=html;document.title=title+' · Pausenwerk – Ernährung im BVJ';
 for(const [id,current] of [['nav-start',title==='Kursübersicht'],['nav-plan',path==='unterricht']]){const a=document.getElementById(id);if(current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')}
 updateTotal();if(moveFocus){main.focus({preventScroll:true});window.scrollTo(0,0)}
}
function replaceQuiz(id){const current=document.getElementById('prueffragen');current.outerHTML=quiz(id)}
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.hasAttribute('data-note')){memory[el.dataset.note]=el.value;save()}
 if(el.hasAttribute('data-q')){const id=el.form.dataset.id;if(assessed(id))return;const a=answers(id);a[el.dataset.q]=el.value;memory[answersName(id)]=a;el.closest('fieldset').querySelector('.hintmsg')?.remove();save()}
});
document.addEventListener('change',e=>{const el=e.target;
 if(el.hasAttribute('data-sort')){memory['sort'+el.dataset.sort]=el.value;save();document.getElementById('sort-message').textContent=''}
 if(el.hasAttribute('data-pick')){memory['pick'+el.dataset.pick]=el.checked;save();updateTotal()}
});
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-jump],.skip');if(a){e.preventDefault();const target=document.getElementById(a.dataset.jump||'inhalt');if(target){target.tabIndex=-1;target.focus();target.scrollIntoView({block:'start'})}return}
 const b=e.target.closest('button[data-act]');if(!b)return;
 if(b.dataset.act==='sort'){const missed=foods.filter((f,i)=>memory['sort'+i]!==String(groupKeys[i]));document.getElementById('sort-message').textContent=missed.length?(foods.length-missed.length)+' von 6 richtig. Prüfe noch einmal: '+missed.join(', ')+'.':'Alle sechs Lebensmittel sind richtig zugeordnet.'}
 if(b.dataset.act==='retry'){const id=b.form.dataset.id;delete memory[answersName(id)];delete memory['graded-'+id];save();replaceQuiz(id);document.querySelector('#quizform input').focus()}
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='quizform')return;e.preventDefault();const id=e.target.dataset.id;if(assessed(id))return;const items=quizSets[id],a=answers(id);
 const missing=items.findIndex((q,i)=>{const v=String(a[i]??'').trim();return q.options?v==='':! /^(?:\d+(?:[.,]\d+)?|[.,]\d+)$/.test(v)});
 if(missing>=0){const msg='Frage '+(missing+1)+': '+(items[missing].options?'Wähle eine Antwort.':'Trage eine Zahl ohne Einheit ein.');const box=document.getElementById('frage-'+missing);let err=box.querySelector('.hintmsg');if(!err){err=document.createElement('div');err.className='hintmsg';err.setAttribute('role','alert');box.append(err)}err.textContent=msg;box.querySelector('input').focus();return}
 memory['graded-'+id]=true;save();replaceQuiz(id);document.getElementById('quizsummary').focus()
});
window.addEventListener('hashchange',()=>render(true));
render();
</script>
</body>
</html>
